name: Update gist
on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule: # 00:00 KST == 15:00 UTC
    - cron: "0 15 * * *"
jobs:
  update-gist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for the keepalive step to push an empty commit
    steps:
      - uses: actions/checkout@v5
      - name: Update gist
        uses: maxam2017/productive-box@master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TIMEZONE: Asia/Seoul
      # Keeps the scheduled workflow from being auto-disabled after 60 days of inactivity.
      # Pushes an empty keepalive commit only when the repo has had no commits for 50+ days.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 50 ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit --allow-empty -m "chore: keepalive to prevent workflow auto-disable"
              git push
          fi
